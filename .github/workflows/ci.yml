name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Build before the checks below: they read the packages' dist output.
      - run: pnpm build
      # tsc in every package, plus `astryx integration check --strict` for @venture-ui/ui.
      - run: pnpm typecheck
      # The committed built theme must match its source (fails when stale).
      - run: pnpm theme:check
      # Tree-shaking budget for the built example app.
      - run: pnpm size

  # Playwright against the built gallery: a screenshot and an axe check per story, in light and dark, at 390 and
  # 1280 px. Screenshot baselines (e2e/snapshots/*-linux.png) come from Chromium in the official Playwright image, so
  # this job runs in that same image, and `pnpm e2e` locally re-runs itself in it (scripts/e2e-docker.sh). The image tag
  # must match @playwright/test in e2e/package.json; a mismatch fails loudly ("Executable doesn't exist").
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      E2E_IN_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The gallery and the packages it imports; e2e reads examples/gallery/dist.
      - run: pnpm --filter "@venture-ui/e2e..." build
      - run: pnpm e2e
      # The HTML report holds the expected, actual and diff image of every failed screenshot.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      # Docker-free way to refresh baselines: when this job fails, re-render the screenshots here (the platform they
      # must match) and publish them. Review the images, then copy the files into e2e/snapshots and commit them.
      - if: failure()
        run: pnpm e2e --update-snapshots || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-baselines
          path: e2e/snapshots
          retention-days: 7

  # Shadow type-check with tsrs, the experimental Rust port of the TypeScript checker (issue #2).
  # Reports only: tsc in `check` stays the gate and the emitter. Never make this a required status. tsrs is installed by
  # the script into the runner's temp dir, not from the lockfile, so `check` never installs it.
  typecheck-tsrs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package typechecks read their workspace dependencies' dist output.
      - run: pnpm build
      - run: pnpm typecheck:tsrs | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        env:
          TSRS_CACHE: ${{ runner.temp }}/tsrs
